      - { name: episodio, label: Número do episódio, widget: number, value_type: int, required: false, comment: "Forma o T01E01 do cartão." }
      - { name: duracao_s, label: Duração em segundos, widget: number, value_type: int, required: false, comment: "Entra no total de horas do topo da página. Em segundos: 3376 = 56 min." }
      - { name: visualizacoes, widget: hidden }

  # ============================================ O QUE NÃO ESTÁ NO PAINEL ===
  #
  # As frases fixas da página inicial — o topo, a chamada do abcpod, a biografia
  # e as listas de prêmios — NÃO têm aba aqui, de propósito.
  #
  # Elas mudam uma vez por ano, exigem cuidado com a marcação e não são o
  # trabalho de quem escreve. Ter isso no painel só dava chance de esbarrar: o
  # formulário tinha quatro blocos, dezoito campos e um nome ("Textos da página
  # inicial") que parecia um segundo lugar para gerenciar textos, competindo com
  # Diário, Coluna e Textos. Painel bom é painel curto: aqui ficou só o que o
  # Enrico faz toda semana.
  #
  # ONDE ESSAS FRASES MORAM: conteudo/secoes.json, editado direto no arquivo.
  # A marcação é simples (veja ferramentas/marcacao.py):
  #
  #     *obra*            título de livro, sai em itálico
  #     **destaque**      negrito
