      - { name: nota, label: Nota, widget: string, required: false, comment: "Base do cálculo das estrelas do cartão.", hint: "Formato com vírgula, como na Amazon: 4,6" }
      - { name: avaliacoes, label: Número de avaliações, widget: number, value_type: int, required: false, comment: "Número entre parênteses ao lado das estrelas." }
      - { name: ordem, label: Posição no carrossel, widget: number, value_type: int, min: 1, comment: "Define a ordem dos livros na página inicial.", hint: "1 aparece primeiro." }
      - { name: asin, label: Código ASIN da Amazon, widget: string, comment: "Identifica o livro na Amazon. Não aparece no site.", hint: "Código depois de /dp/ no endereço da Amazon. Ex.: B0DYPFP8FN" }

