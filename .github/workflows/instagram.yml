# Busca os posts novos do Instagram e renova a chave da Meta.
#
# POR QUE ISTO É UM FLUXO SEPARADO
#
# A publicação do site não fala com a Meta. Este fluxo baixa os posts, comita o
# que mudou, e o commit dispara a publicação normal. Assim, se a API cair ou a
# chave vencer, o site continua no ar com os últimos posts baixados — o que
# quebra é a atualização, não a página.
#
# A CHAVE VENCE A CADA 60 DIAS
#
# A chave de longa duração da Meta expira em 60 dias, e só pode ser renovada
# enquanto está válida. Por isso este fluxo roda de dois em dois dias mesmo que
# não haja post novo: cada execução renova o prazo. Ficar 60 dias sem rodar
# significa começar tudo de novo, com o Enrico autorizando outra vez.
#
# A chave renovada é gravada de volta no segredo do repositório, o que exige um
# token com permissão de administrar segredos (SEGREDOS_TOKEN). Sem ele o fluxo
# ainda busca e publica os posts, mas termina em vermelho: a renovação estaria
# acontecendo e sendo descartada, e isso só apareceria no dia 60, quebrado.

name: instagram

on:
  schedule:
    # 09:10 UTC (06:10 em Brasília), dia sim dia não.
    - cron: "10 9 */2 * *"
  workflow_dispatch:

# Escrever no repositório (comitar os posts) e disparar outro fluxo.
#
# O disparo é necessário, não é luxo: commit feito com o token padrão do Actions
# NÃO aciona outros fluxos — o GitHub bloqueia isso para não criar laço infinito.
# Sem chamar a publicação na mão, os posts ficavam comitados e o site continuava
# com a versão antiga até alguém publicar por outro motivo.
permissions:
  contents: write
  actions: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: instalar as dependências
        run: python -m pip install --quiet pillow

      - name: conferir se a chave existe
        env:
          TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::falta o segredo INSTAGRAM_TOKEN."
            echo "Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      # Renova ANTES de buscar: se a chave estiver perto do fim, a busca já vai
      # com a nova. A resposta traz a chave e quantos segundos ela ainda vale.
      - name: renovar a chave
        id: renovar
        env:
          TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: |
          set -euo pipefail
          resposta=$(curl -sS -G "https://graph.instagram.com/refresh_access_token" \
            --data-urlencode "grant_type=ig_refresh_token" \
            --data-urlencode "access_token=$TOKEN") || resposta=""

          nova=$(echo "$resposta" | jq -r '.access_token // empty')
          if [ -z "$nova" ]; then
            echo "::warning::não deu para renovar a chave. A busca segue com a atual."
            echo "resposta: $(echo "$resposta" | head -c 300)"
            echo "renovada=nao" >> "$GITHUB_OUTPUT"
          else
            dias=$(( $(echo "$resposta" | jq -r '.expires_in // 0') / 86400 ))
            echo "chave renovada, vale por ~$dias dias"
            echo "::add-mask::$nova"
            echo "nova=$nova" >> "$GITHUB_OUTPUT"
            echo "renovada=sim" >> "$GITHUB_OUTPUT"
          fi

      # Guarda a chave nova no próprio segredo. Sem SEGREDOS_TOKEN este passo é
      # pulado e o aviso explica o que fazer — o fluxo não falha por isso.
      - name: guardar a chave renovada
        id: guardar
        if: steps.renovar.outputs.renovada == 'sim'
        env:
          GH_TOKEN: ${{ secrets.SEGREDOS_TOKEN }}
          NOVA: ${{ steps.renovar.outputs.nova }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            # Aqui só ANOTA a falta, e o job segue: este passo roda ANTES da
            # busca, e morrer nele deixaria o site sem post nenhum — punindo a
            # página por um segredo que falta nos bastidores. Os posts entram
            # hoje; quem derruba a execução é o último passo, para o aviso
            # chegar por e-mail sem custar o conteúdo.
            echo "faltou=sim" >> "$GITHUB_OUTPUT"
            echo "::error::a chave foi renovada mas NÃO pôde ser guardada."
            echo "Falta o segredo SEGREDOS_TOKEN: um token pessoal do GitHub com"
            echo "permissão de escrever segredos NESTE repositório."
            echo ""
            echo "Sem ele, a integração para em 60 dias e o autor precisa"
            echo "autorizar outra vez. Com ele, nunca mais."
            echo ""
            echo "Criar em: https://github.com/settings/personal-access-tokens/new"
            echo "  Repository access: apenas Syfer2025/enrico"
            echo "  Permissions -> Repository -> Secrets: Read and write"
            echo "  Expiration: No expiration"
            echo "Depois guarde o valor como SEGREDOS_TOKEN nos segredos do repo."
            exit 0
          fi
          printf '%s' "$NOVA" | gh secret set INSTAGRAM_TOKEN --repo "$GITHUB_REPOSITORY"
          echo "segredo INSTAGRAM_TOKEN atualizado"

      - name: buscar os posts
        env:
          INSTAGRAM_TOKEN: ${{ steps.renovar.outputs.nova || secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python3 ferramentas/gen-instagram.py --buscar

      # Só comita se algo mudou de verdade. Post novo muda o json e traz imagem;
      # sem post novo, nada aqui altera arquivo nenhum.
      - name: comitar o que mudou
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # `git add` ANTES de conferir. Na primeira execução o json e as
          # imagens são arquivos NOVOS, e `git diff` não vê arquivo que o git
          # ainda não conhece: ele dizia "nada a comitar" com seis posts
          # baixados na pasta. Com eles no índice, `--cached` compara certo.
          git add -A -- conteudo/instagram.json publicar/assets/img/instagram

          if git diff --cached --quiet -- conteudo/instagram.json publicar/assets/img/instagram; then
            echo "nenhum post novo. nada a comitar."
            exit 0
          fi

          quantos=$(python3 -c "import json;print(len(json.load(open('conteudo/instagram.json'))['posts']))")
          git commit -m "instagram: $quantos posts mais recentes

          Buscado pelo fluxo .github/workflows/instagram.yml. As imagens ficam
          no repositório porque o endereço que a Meta devolve expira em horas."
          git push
          echo "commitado"

      # Chama a publicação na mão, pelo motivo explicado em `permissions`.
      - name: publicar o site
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git log -1 --format=%s | grep -q "^instagram:"; then
            gh workflow run publicar.yml --ref main
            echo "publicação disparada"
          else
            echo "nada novo foi comitado; não há o que publicar"
          fi

      - name: a chave está sendo jogada fora
        # Último passo de propósito, DEPOIS de publicar: `publicar o site` roda
        # sob `if: success()`, e falhar antes dele deixava o site na versão
        # antiga. A execução termina em VERMELHO e o GitHub
        # manda e-mail hoje, em vez de a integração morrer calada no dia 60 —
        # quando o conserto já custaria pedir nova autorização ao autor.
        if: always() && steps.guardar.outputs.faltou == 'sim'
        run: |
          echo "::error::a chave do Instagram é renovada a cada execução e"
          echo "descartada em seguida, porque falta o segredo SEGREDOS_TOKEN."
          echo "Os posts desta execução foram publicados normalmente."
          echo "No dia 60 a chave guardada vence e a integração para."
          echo "O conserto é uma vez e não envolve o autor: veja o passo"
          echo "'guardar a chave renovada' acima, que traz o link e os campos."
          exit 1
